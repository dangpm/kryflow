<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#0c0e12;color:#f3f5f8;font-family:"Be Vietnam Pro",system-ui,sans-serif}
  .og{position:relative;width:1200px;height:630px;padding:64px 72px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between}
  .og::before{content:"";position:absolute;right:-140px;top:-160px;width:560px;height:560px;border-radius:50%;background:radial-gradient(closest-side,rgba(231,184,102,.22),transparent 70%)}
  .brand{display:flex;align-items:center;gap:14px;font-weight:600;font-size:26px}
  .mark{width:44px;height:44px;border-radius:12px;background:#e7b866;color:#1a1206;display:grid;place-items:center;font-family:"JetBrains Mono",monospace;font-weight:500;font-size:22px}
  .brand small{font-weight:400;color:#8b94a3;font-size:18px;margin-left:6px}
  h1{margin:0;font-weight:400;font-size:64px;line-height:1.1;letter-spacing:-.015em;max-width:820px}
  p{margin:18px 0 0;color:#8b94a3;font-size:24px;max-width:760px;line-height:1.45}
  .row{display:flex;gap:10px;align-items:center;font-family:"JetBrains Mono",monospace;font-size:16px;color:#8b94a3}
  .row span{padding:6px 12px;border:1px solid #2f3540;border-radius:8px;background:#14171d;color:#f3f5f8}
  .row i{color:#5b636f;font-style:normal}
  .row .one{border-top:2px solid #fbbf24}.row .two{border-top:2px solid #34d8c4}.row .live{border-top:2px solid #4ade80}
</style></head>
<body><div class="og">
  <div class="brand"><span class="mark">K</span>KryFlow <small>kryflow.dang.pm</small></div>
  <div><h1>Mỗi bước một việc, mỗi việc một cửa gác</h1><p>Xây sản phẩm bằng ChatGPT hoặc Gemini theo quy trình có cửa gác. Bản rút gọn của Kry Lifecycle cho người mới.</p></div>
  <div class="row"><span class="one">mở việc</span><i>→</i><span class="one">luồng · nền · gu</span><i>→</i><span class="two">kế hoạch → làm → kiểm</span><i>→</i><span class="live">giao → hồ sơ → sửa ↺</span></div>
</div></body></html>
